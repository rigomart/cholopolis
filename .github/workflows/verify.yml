name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

      - run: bun run build

      - name: Worker types are up to date
        run: |
          bun run types
          git diff --exit-code worker/worker-configuration.d.ts || (echo "::error::Run 'bun run types' and commit worker/worker-configuration.d.ts" && exit 1)
